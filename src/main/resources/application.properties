# ================================
# DATABASE CONFIG ? PostgreSQL (Neon)
# ================================
# Local dev falls back to a local Postgres instance. On Render, set
# SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD as environment variables
# pointing at your Neon database.
#
# NOTE: no driver-class-name is set ? Spring Boot auto-detects the correct
# JDBC driver (Postgres) from the URL scheme. Do not hardcode
# com.mysql.cj.jdbc.Driver here; that was leftover from an earlier MySQL
# setup and will break the Postgres connection if reintroduced.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/job_portal_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# ================================
# JPA / HIBERNATE
# ================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ================================
# SERVER
# ================================
# Render assigns its own port via the PORT env var ? do not hardcode a
# fixed port in the Dockerfile ENTRYPOINT; let this property (and Render's
# injected PORT) control it, same as this default suggests.

server.port=${PORT:10000}
server.address=0.0.0.0
server.servlet.context-path=/

# ================================
# AI KEY
# ================================

groq.api.key=${GROQ_API_KEY:}

# ================================
# JWT
# ================================
# MUST be set as a real env var in production ? no safe default should
# ever ship to prod. Generate one with: openssl rand -base64 48
jwt.secret=${JWT_SECRET:LocalDevOnlySecretKeyChangeThisBeforeProd_MustBe32CharsMin}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ================================
# CORS (frontend origin)
# ================================
# Comma-separated if multiple origins. Set this on Render to your real
# deployed frontend URL(s).
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}